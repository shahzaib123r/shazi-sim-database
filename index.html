<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SHAZI Search</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

    <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg-1: #070b14;
    --bg-2: #101827;
    --bg-3: #1d2433;
    --panel: rgba(17, 24, 39, 0.9);
    --panel-soft: rgba(22, 32, 47, 0.88);
    --line: rgba(255, 255, 255, 0.08);
    --text: #f3f6fb;
    --muted: #a8b2c5;
    --accent: #6ea8fe;
    --accent-2: #8b5cf6;
    --accent-3: #f472b6;
    --shadow: 0 16px 38px rgba(0, 0, 0, 0.34);
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(110, 168, 254, 0.15), transparent 24%),
      radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.16), transparent 26%),
      linear-gradient(135deg, #070b14 0%, #0f172a 38%, #111827 100%);
    font-family: 'Poppins', sans-serif;
    letter-spacing: 0.2px;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
    opacity: 0.7;
    z-index: 0;
  }

  #particles,
  .glow {
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }

  #particles {
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.7;
  }

  .glow {
    width: 280px;
    height: 280px;
    filter: blur(90px);
    opacity: 0.45;
    border-radius: 50%;
  }

  .glow-1 {
    top: 8%;
    right: 7%;
    background: rgba(110, 168, 254, 0.35);
  }

  .glow-2 {
    bottom: 8%;
    left: 7%;
    background: rgba(139, 92, 246, 0.28);
  }

  .page-shell {
    position: relative;
    z-index: 1;
  }

  .container {
    width: min(1180px, calc(100% - 24px));
    margin: 0 auto;
    padding: 30px 0 40px;
  }

  .top {
    text-align: center;
    padding: 18px 12px 10px;
  }

  .logo {
    font-size: clamp(2.2rem, 5vw, 4.2rem);
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #ffffff;
    text-transform: uppercase;
    line-height: 1.05;
  }

  .sub {
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.82rem;
    letter-spacing: 2.4px;
    text-transform: uppercase;
  }

  .search-panel {
    margin-top: 34px;
    background: linear-gradient(180deg, rgba(17, 24, 39, 0.95), rgba(15, 23, 42, 0.86));
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 22px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .search-box {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .search-box input {
    flex: 1;
    width: 100%;
    height: 64px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(15, 23, 42, 0.9);
    color: var(--text);
    padding: 0 18px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }

  .search-box input::placeholder {
    color: #8fa1bd;
  }

  .search-box input:focus {
    border-color: rgba(110, 168, 254, 0.8);
    box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.14);
    transform: translateY(-1px);
  }

  .search-btn {
    width: 180px;
    height: 64px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
    color: white;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    box-shadow: 0 10px 22px rgba(110, 168, 254, 0.2);
  }

  .search-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(139, 92, 246, 0.24);
    filter: brightness(1.04);
  }

  .search-btn:active {
    transform: translateY(0);
  }

  .loading {
    display: none;
    width: fit-content;
    margin: 22px auto 0;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(15, 23, 42, 0.78);
    color: var(--text);
    font-size: 0.82rem;
    text-align: center;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-right-color: var(--accent-3);
    margin: 0 auto 8px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .results {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: linear-gradient(180deg, rgba(17, 24, 39, 0.96), rgba(15, 23, 42, 0.88));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(110, 168, 254, 0.35);
  }

  .card-top {
    padding: 22px 22px 18px;
    background: linear-gradient(135deg, rgba(110, 168, 254, 0.08), rgba(139, 92, 246, 0.08));
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .profile {
    width: 68px;
    height: 68px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.6rem;
    box-shadow: 0 12px 24px rgba(110, 168, 254, 0.2);
    margin-bottom: 14px;
  }

  .card-top h2 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .network {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .card-body {
    padding: 20px 22px 22px;
  }

  .field {
    padding: 14px 16px;
    margin-bottom: 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.015);
    border: 1px solid rgba(255,255,255,0.06);
    border-left: 3px solid rgba(110, 168, 254, 0.85);
  }

  .label {
    color: var(--muted);
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .value {
    font-size: 1rem;
    color: var(--text);
    line-height: 1.55;
    word-break: break-word;
  }

  .copy-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #1f6feb, #7c4dff);
    color: white;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 22px rgba(31, 111, 235, 0.18);
  }

  .copy-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 24px rgba(31, 111, 235, 0.24);
  }

  .copy-btn:active {
    transform: translateY(0);
  }

  .footer {
    margin-top: 34px;
    padding: 22px 16px 10px;
    border-top: 1px solid rgba(255,255,255,0.08);
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
  }

  .repo-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
    color: #dfe8f6;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .repo-link:hover {
    color: var(--accent);
  }

  .repo-link svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  @media (max-width: 860px) {
    .search-box {
      flex-direction: column;
      align-items: stretch;
    }

    .search-btn {
      width: 100%;
    }
  }

  @media (max-width: 640px) {
    .container {
      width: calc(100% - 16px);
    }

    .search-panel {
      padding: 18px;
    }

    .results {
      grid-template-columns: 1fr;
    }

    .card-top,
    .card-body {
      padding-left: 18px;
      padding-right: 18px;
    }

    .logo {
      font-size: 2.1rem;
      letter-spacing: 0.6px;
    }

    .sub {
      letter-spacing: 1.3px;
      font-size: 0.72rem;
    }
  }
</style>
</head>

<body>

  <canvas id="particles"></canvas>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="page-shell">
    <div class="container">

    <div class="top">
      <div class="logo">SHAZI SIM DATABASE</div>

      <div class="sub">
        Advanced Information Dashboard
      </div>
    </div>

    <div class="search-panel">

      <div class="search-box">

        <input type="text"
          id="number"
          placeholder="Enter number here with 0">

        <button class="search-btn"
          onclick="searchData()">
          SEARCH
        </button>

      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        Searching Database...
      </div>

      <div class="results"
        id="results"></div>

    </div>

    <div class="footer">
      POWERED BY SHAHZAIB
      <a class="repo-link" href="https://github.com/shahzaib123r/shazi-sim-database" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 0.297C5.373 0.297 0 5.67 0 12.299c0 5.292 3.438 9.786 8.205 11.387.6.111.82-.261.82-.579 0-.286-.011-1.042-.017-2.047-3.338.726-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.089-.745.083-.73.083-.73 1.205.085 1.839 1.238 1.839 1.238 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.76-1.605-2.665-.303-5.467-1.332-5.467-5.93 0-1.31.468-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 0 0 1.008-.322 3.301 1.23a11.51 11.51 0 0 1 3.003-.404c1.018.005 2.045.138 3.003.404 2.29-1.552 3.296-1.23 3.296-1.23.655 1.652.243 2.873.119 3.176.77.84 1.234 1.911 1.234 3.221 0 4.61-2.807 5.624-5.479 5.921.43.372.815 1.102.815 2.222 0 1.605-.015 2.898-.015 3.293 0 .32.216.694.825.576C20.565 22.081 24 17.59 24 12.299 24 5.67 18.627.297 12 .297z" />
        </svg>
        View on GitHub
      </a>
    </div>

  </div>

  <script>

    async function searchData() {

      const number =
        document.getElementById("number").value.trim();

      const results =
        document.getElementById("results");

      const loading =
        document.getElementById("loading");

      if (number == "") {
        alert("Enter number");
        return;
      }

      results.innerHTML = "";
      loading.style.display = "block";

      try {

        const response = await fetch(
          `https://wasifali.biz.id/public_apis/sim-info-api.php?search=${encodeURIComponent(number)}`
        );

        const responseText = await response.text();
        let data = {};

        if (responseText) {
          const trimmedText = responseText.trim().replace(/^[\uFEFF]+/, "");

          try {
            data = JSON.parse(trimmedText);
          } catch (parseError) {
            const jsonMatch = trimmedText.match(/\{[\s\S]*\}/);

            if (!jsonMatch) {
              console.error("Invalid JSON response:", parseError, responseText);
              loading.style.display = "none";
              results.innerHTML = `
                <div class="card" style="padding:25px; text-align:center;">
                  <div class="label">SEARCH RESULT</div>
                  <div class="value" style="font-size:20px; color:#ffd9d9;">
                    API returned an invalid response. Please try again.
                  </div>
                </div>
              `;
              return;
            }

            try {
              data = JSON.parse(jsonMatch[0]);
            } catch (secondParseError) {
              console.error("Failed to parse recovered JSON:", secondParseError, jsonMatch[0]);
              loading.style.display = "none";
              results.innerHTML = `
                <div class="card" style="padding:25px; text-align:center;">
                  <div class="label">SEARCH RESULT</div>
                  <div class="value" style="font-size:20px; color:#ffd9d9;">
                    API returned an invalid response. Please try again.
                  </div>
                </div>
              `;
              return;
            }
          }
        }

        loading.style.display = "none";

        const users = Array.isArray(data.records)
          ? data.records
          : Array.isArray(data.data)
            ? data.data
            : Array.isArray(data.results)
              ? data.results
              : [];

        if (!users.length) {
          const message = data.message || data.error || "No data found for this query";

          results.innerHTML = `
            <div class="card" style="padding:25px; text-align:center;">
              <div class="label">SEARCH RESULT</div>
              <div class="value" style="font-size:20px; color:#ffd9d9;">
                ${message}
              </div>
            </div>
          `;
          return;
        }

        results.innerHTML = users.map(user => {
          const name = user.name || "Unknown";
          const network = user.network || "N/A";
          const mobile = user.mobile || "N/A";
          const cnic = user.cnic || "N/A";
          const address = user.address || "N/A";

          return `
            <div class="card">

              <div class="card-top">

                <div class="profile">
                  ${name.charAt(0).toUpperCase()}
                </div>

                <h2>${name}</h2>

                <div class="network">
                  ${network}
                </div>

              </div>

              <div class="card-body">

                <div class="field">
                  <div class="label">
                    MOBILE NUMBER
                  </div>

                  <div class="value">
                    ${mobile}
                  </div>
                </div>

                <div class="field">
                  <div class="label">
                    CNIC NUMBER
                  </div>

                  <div class="value">
                    ${cnic}
                  </div>
                </div>

                <div class="field">
                  <div class="label">
                    ADDRESS
                  </div>

                  <div class="value">
                    ${address}
                  </div>
                </div>

                <button class="copy-btn"
                  onclick='copyData(${JSON.stringify(user)})'>
                  COPY DATA
                </button>

              </div>

            </div>
          `;
        }).join("");

      } catch (err) {

        loading.style.display = "none";

        results.innerHTML = `
          <div class="card" style="padding:25px; text-align:center;">
            <div class="label">SEARCH RESULT</div>
            <div class="value" style="font-size:20px; color:#ffd9d9;">
              Unable to load data right now.
            </div>
          </div>
        `;

        console.error("Error loading data:", err);

      }

    }

    function copyData(user) {

      const text =

`Name: ${user.name}
Mobile: ${user.mobile}
CNIC: ${user.cnic}
Address: ${user.address}
Network: ${user.network}`;

      navigator.clipboard.writeText(text);

      alert("Copied");

    }

    const particlesCanvas = document.getElementById("particles");

    if (particlesCanvas) {
      const ctx = particlesCanvas.getContext("2d");
      const particles = [];

      function resizeParticles() {
        const ratio = window.devicePixelRatio || 1;
        particlesCanvas.width = window.innerWidth * ratio;
        particlesCanvas.height = window.innerHeight * ratio;
        particlesCanvas.style.width = window.innerWidth + "px";
        particlesCanvas.style.height = window.innerHeight + "px";
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function createParticle() {
        return {
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 2.6 + 1.1,
          a: Math.random() * 0.8 + 0.2,
          speedX: (Math.random() - 0.5) * 0.6,
          speedY: Math.random() * 0.5 + 0.2
        };
      }

      function initParticles() {
        particles.length = 0;
        const total = Math.min(80, Math.max(40, Math.floor(window.innerWidth / 18)));

        for (let i = 0; i < total; i++) {
          particles.push(createParticle());
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        for (const p of particles) {
          p.x += p.speedX;
          p.y += p.speedY;

          if (p.x < -10) p.x = window.innerWidth + 10;
          if (p.x > window.innerWidth + 10) p.x = -10;
          if (p.y > window.innerHeight + 10) {
            p.y = -10;
            p.x = Math.random() * window.innerWidth;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(244, 217, 162, ${p.a})`;
          ctx.fill();
        }

        requestAnimationFrame(animateParticles);
      }

      resizeParticles();
      initParticles();
      animateParticles();
      window.addEventListener("resize", () => {
        resizeParticles();
        initParticles();
      });
    }

  </script>

</body>

</html>
